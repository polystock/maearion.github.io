verified:
  label: >-
    검증한 통설
  cards:
    - badge_class: b-false
      badge: >-
        근거 없음
      href: /myth-senior-dog-protein.html
      claim: >-
        "노령견은 단백질을 줄여야 한다"
      summary: >-
        1940년대 쥐 실험에서 비롯된 통설. 건강한 노령견에서 단백질 제한은 불필요하며 근육 손실을 악화시킬 수 있고, 필요량은 오히려 증가하는 것으로 보고됩니다. 신장병이 있을 때는 병기에 따라 인 제한과 단백질 조정을 함께 판단합니다.
      home:
        tag_class: t-false
        desc: >-
          1940년대 설치류 연구에서 온 통설. 건강한 노령견에서 제한은 불필요하며 근육 손실을 악화시킬 수 있습니다.
    - badge_class: b-false
      badge: >-
        근거 없음
      href: /myth-dog-age-seven.html
      claim: >-
        "강아지 나이 × 7 = 사람 나이"
      summary: >-
        20세기 중반에 퍼진 어림값으로 뒷받침하는 연구가 없습니다. 첫 1년이 사람 약 15세에 해당하고 2년째에 약 24세가 되며, 이후 체구에 따라 매년 4~7세가 더해지는 곡선 형태입니다.
      home:
        tag_class: t-false
        desc: >-
          첫 1년이 사람 약 15세, 2년째에 약 24세가 되고 이후 체구에 따라 매년 4~7세가 더해지는 곡선입니다.
    - badge_class: b-partial
      badge: >-
        효과 확인 안 됨
      href: /dog-joint-supplement-guide.html
      claim: >-
        "글루코사민·콘드로이친이 관절에 좋다"
      summary: >-
        2022년 개·고양이 골관절염 체계적 문헌고찰·메타분석은 뚜렷한 효과가 없었다며 통증 관리 목적의 권장 중단을 제언했습니다. 같은 분석에서 오메가3는 명확한 효과가, 콜라겐은 약한 효과가 확인됐습니다. 다만 2023년 COAST 국제 합의와 2024년 리뷰는 이보다 덜 단정적이어서, "효과가 확립되지 않았다"까지가 공통된 정리입니다.
      home:
        tag_class: t-none
        desc: >-
          2022년 골관절염 메타분석은 뚜렷한 효과가 없었다며 통증 관리 목적의 권장 중단을 제언했습니다.
    - badge_class: b-partial
      badge: >-
        부분적으로 맞음
      href: /dog-heatstroke.html
      claim: >-
        "개가 더위로 쓰러지는 것은 주로 더운 차 안이다"
      summary: >-
        영국에서 90만 마리 이상의 1차 진료 기록을 검토한 2020년 연구에서 열관련질환의 유발 요인은 운동 74.2%, 환경 12.9%, 차량 감금 5.2%였습니다. 다만 이는 기록된 사례 수의 분포이지 노출당 위험 비교가 아니며, 중증으로 진행할 위험은 열원을 피할 수 없는 차량 상황에서 오히려 높았습니다. 뒤집히는 것은 위험의 순위가 아니라 "차 안만 조심하면 된다"는 인식입니다. 영국 자료라 수치를 그대로 옮길 수는 없습니다.
    - badge_class: b-false
      badge: >-
        근거 없음
      href: /dog-heatstroke.html
      claim: >-
        "열사병에는 미지근한 물로 천천히 식혀야 한다"
      summary: >-
        1980년 실험에서 얼음물 침수 직후 사망 사례가 보고되며 말초 혈관 수축 우려가 제기됐고, 그것이 "찬물 금지" 조언으로 남았습니다. 정작 그 연구의 결론은 15~16℃ 수돗물이 효율적이라는 것이었습니다. 2016년 권고는 이송보다 냉각을 먼저 시작하되 대상을 나눕니다 — 젊고 건강한 개는 냉수 침수, 고령이거나 동반 질환이 있는 개는 증발 냉각입니다. 얼음물과 냉수는 구분해야 하며, 의식이 저하된 개는 담그지 않습니다.
    - badge_class: b-partial
      badge: >-
        부분적으로 맞음
      href: /dog-periodontal-disease.html
      claim: >-
        "3세 이상 개의 80%는 치주질환이다"
      summary: >-
        측정 방법과 연구 대상에 따라 달라지는 숫자입니다. 깨어 있는 상태의 육안 검사에 기반한 1차 진료 기록에서는 9.3~18.2%, 영국 VetCompass 1년 기간 유병률은 12.52%였습니다. 반면 마취 상태의 상세 검사에서는 44~100%가 보고됩니다. 두 값은 모순이 아니라 서로 다른 잣대입니다. 다만 모든 품종의 3세 이상 개를 대표하는 단일 조사에서 정확히 80%가 산출됐다는 원자료는 확인하지 못했습니다.
    - badge_class: b-false
      badge: >-
        권고와 어긋남
      href: /dog-periodontal-disease.html
      claim: >-
        "무마취 스케일링으로 치아 관리를 할 수 있다"
      summary: >-
        2019년 AAHA 치과 진료 지침은 무마취 처치를 스트레스·손상·흡인 위험·진단 불가를 이유로 적절하지 않다고 기술하며, 미국수의치과학회도 반대 입장문을 유지합니다. 제거되는 것은 잇몸 위 치석 일부이고 질환이 진행되는 자리는 잇몸 아래여서, 학회들은 이것이 잘못된 안도감을 준다고 경고합니다.
    - badge_class: b-partial
      badge: >-
        부분적으로 맞음
      href: /myth-neutering-weight-gain.html
      claim: >-
        "중성화하면 살이 찐다"
      summary: >-
        골든 리트리버 2,764마리를 추적한 연구에서 중성화한 개의 과체중·비만 위험은 수술 시기와 관계없이 약 1.6~2.2배였습니다. 고양이 실험에서는 수술 뒤 먹는 양이 늘거나 필요한 열량이 줄어, 전과 같은 방식으로 먹이면 체중이 늘었습니다. 위험 증가는 사실이며, AAHA 지침은 중성화 뒤 급여량을 줄이라고 권고합니다.
    - badge_class: b-false
      badge: >-
        근거 없음
      href: /myth-dry-nose-sick.html
      claim: >-
        "코가 마르면 아픈 것이다"
      summary: >-
        개의 코끝 온도는 기온과 깨어 있는지 잠들었는지에 따라 정상적으로 달라집니다. 코가 마르거나 따뜻한 것만으로 병을 판별할 수 있다는 연구는 찾지 못했고, 체온 평가의 기준은 직장 체온입니다. 다만 딱지·갈라짐·탈색이 생기면 코 자체의 질환일 수 있습니다.
    - badge_class: b-false
      badge: >-
        근거 없음
      href: /myth-grain-free-better.html
      claim: >-
        "그레인프리가 더 좋다"
      summary: >-
        곡물을 뺀 사료가 더 건강하다는 근거는 찾지 못했습니다. 개 297마리의 음식 알레르기 원인은 소고기·유제품·닭고기가 많았고 밀은 13%였습니다. FDA는 그레인프리 등 콩류가 많은 사료와 개 확장성 심근병증의 연관 가능성을 조사했지만 인과관계를 확정하지 못한 채 2022년 정기 공개를 멈췄습니다.
    - badge_class: b-partial
      badge: >-
        부분적으로 맞음
      href: /myth-feeding-guide-on-bag.html
      claim: >-
        "사료 봉투 권장 급여량대로 주면 된다"
      summary: >-
        AAFCO는 완전·균형 사료에 급여 지침을 적도록 요구하지만, AAHA 지침은 그 양을 정하는 과정이 표준화돼 있지 않다고 적습니다. WSAVA 지침은 외래 환자에게 라벨 권장량을 출발점으로 쓸 수 있다고 보면서, 실제 필요 열량이 개에서 ±30%, 고양이에서 ±50%까지 달라질 수 있다고 적습니다. 지침은 체중과 체형 점수를 보며 양을 조정하라고 권고합니다.
    - badge_class: b-partial
      badge: >-
        부분적으로 맞음
      href: /myth-human-food-forbidden.html
      claim: >-
        "사람 음식은 무조건 안 된다"
      summary: >-
        양파·마늘, 포도·건포도, 초콜릿, 자일리톨처럼 개·고양이에게 독성이 있는 사람 음식은 실제로 있고, 익혀도 위험한 것이 있습니다. 그러나 WSAVA 보호자 안내문은 사람이 먹는 음식으로 간식을 만들 수 있다고 적고, 기름기 없이 익힌 닭가슴살 등을 예로 들며 간식 전체를 하루 열량의 10% 이하로 하라고 권합니다. 위험한 품목을 피하고 양을 관리하라는 것이 지침의 방향입니다.
misinfo:
  label: >-
    잘못 퍼진 정보
  cards:
    - badge_class: b-error
      badge: >-
        계산식 오류
      href: /dog-daily-calorie-calculation.html
      claim: >-
        "RER = 70 × (체중 × 0.75)"
      summary: >-
        국내 자료 다수에서 보이는 표기입니다. 0.75는 곱하는 수가 아니라 지수(거듭제곱)이며, 올바른 식은 70 × 체중^0.75입니다. 곱셈으로 계산하면 값이 어긋나고, 체중이 클수록 오차가 커집니다.
      home:
        tag_class: t-err
        desc: >-
          0.75는 곱하는 수가 아니라 지수입니다. 올바른 식은 70 × 체중^0.75입니다.
